# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 回车提交还是插入提示：steer = 忙时也作为引导发出去（跟旧壳一致）
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer

# ★ 关掉「模型凭据引导」弹窗。
#   这个插件的 schema 默认是 credentialOnboarding=true，前端一看到 true 就弹
#   「操作未完成，请重试 / 添加 APIKey」，而那个「重新登录」按钮不解决任何问题
#   ——它不是登录态问题，是个首次使用引导页的开关。
#   我们已经在下面 agent-default-model 里声明了 provider + model，
#   全局 cordis.patch.yml 里也带了 DEEPSEEK_API_KEY，不需要这个引导。
- id: ui-settings-models
  name: "@deepseek-ai/dsh-client-ui-settings-models"
  config:
    credentialOnboarding: false

# ★ 默认模型：走「DeepSeek 账号登录」（deepseek-account），不是 API key。
#   dsh-base 里 deepseek-account 指的是 dsh-deepseek-account-platform
#   （浏览器 PKCE 授权，https://platform.deepseek.com/oauth/callback），
#   前端把它排在 provider 列表第一位。
#   如果哪天想切回 API key，把 provider 改成 deepseek-official 即可
#   （credentials 里已有 DEEPSEEK_API_KEY，两套可并存）。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: max

# 并行工具调用上限：24（旧壳实测值，手机端够用且不至于把 CPU 打满）
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 24

# ★ 我们自己的插件（不是社区壳带回来的，是本地开发的）
#   包放在 dshhome/profiles/web/node_modules/dsh-tool-phone-health/
#   之所以放在 dshhome 而不是 dshroot：dshroot 会被 dsh-upgrade 整体替换，
#   dshhome 不动 —— 这样升级 dsh 内核不会把自有插件冲掉。
- insert:
    - id: tool-phone-health
      name: "dsh-tool-phone-health"
