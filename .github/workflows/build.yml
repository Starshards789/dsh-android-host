name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不要用 android-actions/setup-android@v3：
      # 它会去装一个已废弃的 "tools" 包，直接 "Failed to find package 'tools'" 挂掉。
      # GitHub 的 ubuntu runner 本来就预装 Android SDK，$ANDROID_HOME 已就绪。
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(none)"
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(none)"

      # 只在预装缺 34 时补装，避免每次都跑 sdkmanager
      - name: Ensure SDK 34 present
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "android-34 缺失，补装"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "android-34 已存在，跳过"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        if: success()
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk/debug -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-host-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
